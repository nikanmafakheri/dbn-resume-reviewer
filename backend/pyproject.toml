[project]
name = "dbn-resume-reviewer"
version = "0.1.0"
description = "AI-powered Resume Reviewer SaaS — Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.0",
    "PyMuPDF>=1.24.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
# Run all async fixtures AND tests on the single session event loop.
# asyncpg/Postgres binds connections to the loop they were created on. If
# tests ran on a per-test (function) loop while the session-scoped ``db_engine``
# lives on the session loop, teardown tries to close a connection on a different
# loop → "Future attached to a different loop" / InternalClientError. SQLite was
# immune to this; Neon/asyncpg is not.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# AppException is an intentional internal naming choice (not an Error suffix).
ignore = ["N818"]
