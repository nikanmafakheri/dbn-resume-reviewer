# Top-level docker-compose.yml
#
# The application database is a managed Neon Postgres instance (no local `db`
# container). DATABASE_URL is provided by ./backend/.env (env_file below) and
# must be a `postgresql+asyncpg://...neon.tech/...` string. Redis remains an
# orchestrated service (rate-limit + Celery broker/result backend).
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Inside the compose network, Redis is reachable at hostname `redis` —
      # override the localhost default from .env only.
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Prod path: migrations own the schema (Dockerfile runs `alembic upgrade
      # head` when DEBUG != "true"); DEBUG=true would let create_all bootstrap.
      DEBUG: "false"
      # Template is mounted read-only at /app/templates (see volumes below).
      TEMPLATE_PPTX_PATH: /app/templates/Black and White Minimalist Professional Resume A4.pptx
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      # Template lives outside the backend build context; mount it read-only so
      # the /template/download endpoint resolves TEMPLATE_PPTX_PATH.
      - ./dbn-standard-resume-template:/app/templates:ro

  celery-worker:
    build: ./backend
    command: celery -A app.workers.celery worker --loglevel=info
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - api
      - redis
    volumes:
      - ./backend/media:/app/media

  celery-beat:
    build: ./backend
    command: celery -A app.workers.celery beat --loglevel=info
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - api
      - redis
      - celery-worker

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redisdata: